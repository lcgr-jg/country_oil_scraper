# Country registry for the central warehouse and demand dashboard.
# Enable a country here, run consolidate_warehouse.py — existing scrapers unchanged.
#
# Optional YAML keys:
#   unit_native       — override when reference module has mixed / missing unit const
#   unit_native_attr  — attribute name on reference module (e.g. MASE_UNIT_NATIVE)
#   product_column    — parquet product column if not product_native (India: product)
#   value_column      — parquet value column if not value (India: value_000mt)
#   jet_product_native — native line for Kayrros jet panel in the dashboard
#   reference_module  — omit for countries without a reference package (none yet)

countries:
  germany:
    display_name: Germany
    country_code: "DE"
    enabled: true
    official_source_label: BAFA
    parquet:
      rel_path: germany/germany_bafa_demand.parquet
    reference_module: reference.germany
    jodi_ref_area: "DE"
    demand_metric_type: TOTDEMO
    jet_product_native: "Flugturb.Kraftst.,schwer"

  norway:
    display_name: Norway
    country_code: "NO"
    enabled: true
    official_source_label: SSB
    parquet:
      rel_path: norway/norway_ssb_sales.parquet
    reference_module: reference.norway
    jodi_ref_area: "NO"
    demand_metric_type: TOTDEMO
    jet_product_native: Jet kerosene
    kayrros:
      enabled: true
      products:
        - product_key: jet_fuel
          product_canonical: Jet fuel
          scope_type: country
          scope: "NO"
          country_match: code

