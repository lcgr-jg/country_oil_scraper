[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "country-oil-scraper"
version = "0.1.0"
description = "Modular scrapers for national petroleum statistics, warehouse, and dashboards"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "curl_cffi>=0.7",
  "beautifulsoup4>=4.12",
  "pandas>=2.1",
  "openpyxl>=3.1",
  "odfpy>=1.4",
  "xlrd>=2.0.1",
  "pdfplumber>=0.11",
  "pyyaml>=6.0",
  "lxml>=4.9",
  "pyarrow>=14.0",
  "plotly>=5.18",
  "matplotlib>=3.8",
  "streamlit>=1.28",
  "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "jupyter>=1.0",
  "ipykernel>=6.0",
  "ipywidgets>=8.0",
]
orchestration = [
  "prefect>=3.0",
]
all = [
  "pytest>=7.0",
  "jupyter>=1.0",
  "ipykernel>=6.0",
  "ipywidgets>=8.0",
  "prefect>=3.0",
]

[project.scripts]
oil-pipeline = "pipelines.cli:main"

[tool.setuptools.packages.find]
include = [
  "scrapers*",
  "processors*",
  "reference*",
  "warehouse*",
  "analytics*",
  "pipelines*",
  "orchestration*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: hits live network or requires external fixtures",
]
